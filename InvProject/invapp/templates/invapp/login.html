{% extends "invapp/layout.html" %}

{% block title %} Login - Inventory App {% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0">Sign In</h4>
      </div>
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger" role="alert">
            Invalid username or password. Please try again.
          </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="form-group mb-3">
            <label for="id_username" class="form-label font-weight-bold">Username</label>
            <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Enter username">
          </div>
          <div class="form-group mb-4">
            <label for="id_password" class="form-label font-weight-bold">Password</label>
            <input type="password" name="password" required class="form-control" id="id_password" placeholder="Enter password">
          </div>
          <button type="submit" class="btn btn-primary btn-block w-100">Login</button>
        </form>
      </div>
      <div class="card-footer text-muted text-center small">
        Inventory Management System &bull; Users are created via admin
      </div>
    </div>
  </div>
</div>
{% endblock %}
